[FREELOADER]
DefaultOS=LiveImg_ReactV
TimeOut=10

[Display]
TitleText=ReactOS Boot Media
MinimalUI=Yes

[Operating Systems]
LiveImg="ReactOS Live Environment (Graphics Mode)"
LiveImg_SMP_ReactV="ReactOS Live Environment (Graphics Mode) SMP ReactV"
==
;; The entries below are for testing and development:
LiveImg_Screen="Live (Screen Debug) SMP"
LiveImg_ReactV_Net="Network-Boot SMP"
LiveImg_Com1Debug="SMP COM1 Debug"
;; The following entry is an example template:
;LiveImg_LogFile="Live (Log file)"

[Setup]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Debug]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /NOGUIBOOT /SIFOPTIONSOVERRIDE

[Setup_Screen]
BootType=ReactOSSetup
Options=/DEBUG /DEBUGPORT=SCREEN /SIFOPTIONSOVERRIDE

[LiveImg]
BootType=Windows2003
SystemPath=\reactos
Options=/FASTDETECT /MININT

[LiveImg_RamDisk]
BootType=Windows2003
SystemPath=ramdisk(0)\reactos
Options=/FASTDETECT /MININT /RDPATH= /RDEXPORTASCD
;Options=/FASTDETECT /MININT /RDPATH=liveimg.iso /RDEXPORTASCD

[LiveImg_Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=NET /HOST_IP=10.0.0.124 /HOST_PORT=50000 /ENCRYPTION_KEY=make.reactos.great.again /SOS /FASTDETECT /MININT

[LiveImg_VBoxDebug]
BootType=Windows2003
SystemPath=\reactos
Options=/DEBUG /DEBUGPORT=VBOX /SOS /FASTDETECT /MININT

[LiveImg_Screen]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=HALMP.DLL /KERNEL=NTKRNLMP.EXE /DEBUG /DEBUGPORT=SCREEN /SOS /FASTDETECT /MININT

[LiveImg_Com1Debug]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=HALMP.DLL /KERNEL=NTKRNLMP.EXE /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /KDSERIAL /SOS /FASTDETECT /MININT

[LiveImg_ReactV]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=HALMP.DLL /KERNEL=NTKRNLMP.EXE /DEBUG /DEBUGPORT=COM1 /BAUDRATE=115200 /KDSERIAL /SOS /FASTDETECT /MININT /HYPERVISORLAUNCHTYPE=AUTO

[LiveImg_ReactV_Net]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=HALMP.DLL /KERNEL=NTKRNLMP.EXE /DEBUG /DEBUGPORT=NET /HOST_IP=10.0.0.124 /HOST_PORT=50000 /ENCRYPTION_KEY=make.reactos.great.again /SOS /FASTDETECT /MININT

[LiveImg_SMP_ReactV]
BootType=Windows2003
SystemPath=\reactos
Options=/HAL=HALMP.DLL /KERNEL=NTKRNLMP.EXE /FASTDETECT /MININT /HYPERVISORLAUNCHTYPE=AUTO

;[LiveImg_LogFile]
;BootType=Windows2003
;SystemPath=\reactos
;Options=/DEBUG /DEBUGPORT=FILE:\Device\HarddiskX\PartitionY\debug.log /SOS /FASTDETECT /MININT
